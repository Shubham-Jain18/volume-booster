<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 180px;
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 14px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    .value-display {
      font-size: 16px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <div class="container">
    <label for="gain-slider">Volume Booster</label>
    <input type="range" id="gain-slider" min="1" max="5" step="0.1" value="1">
    <div class="value-display"><span id="multiplier">100</span>%</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
